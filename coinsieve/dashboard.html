<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coin Sieve</title>
<style>
  :root {
    --bg: #111215; --side: #0d0e11; --panel: #16171b; --panel2: #1c1d22; --hover: #1f2026; --line: #24252b;
    --text: #ececf1; --muted: #8b8c96; --dim: #5c5d66;
    --green: #2fbd71; --red: #f0475b; --amber: #f2b33d; --blue: #5ea0ff; --violet: #a685ff; --gold: #f2c94c;
    --nl: #5ea0ff; --em: #a685ff; --es: #f2b33d;
    --sidew: 220px; --rightw: 370px; --row: 44px;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; background: var(--bg); color: var(--text); font: 13px/1.35 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, input { font: inherit; color: inherit; }
  .app { height: 100vh; display: grid; grid-template-columns: var(--sidew) minmax(0, 1fr) var(--rightw); grid-template-rows: 46px minmax(0, 1fr); }
  body.public .admin-only { display: none !important; }

  /* sidebar */
  .side { grid-row: 1 / 3; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 12px 10px; min-height: 0; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px 14px; font-weight: 800; font-size: 17px; letter-spacing: .04em; white-space: nowrap; }
  .brand .mark { flex: none; width: 30px; height: 30px; border-radius: 8px; background: #fff; color: #000; display: grid; place-items: center; font-size: 12px; font-weight: 900; letter-spacing: 0; }
  .navlabel { color: var(--dim); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; padding: 6px 8px; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav button { display: flex; align-items: center; gap: 11px; border: 0; background: none; border-radius: 8px; padding: 9px 8px; cursor: pointer; color: var(--muted); font-weight: 600; font-size: 14px; text-align: left; }
  .nav button:hover { background: var(--hover); color: var(--text); }
  .nav button.on { background: var(--panel2); color: var(--text); }
  .nav .ico { flex: none; width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; font: 800 10px var(--mono); color: #0d0e11; }
  .nav .lbl { flex: 1; white-space: nowrap; }
  .nav .cnt { font: 700 11px var(--mono); color: var(--muted); background: #22232a; padding: 1px 7px; border-radius: 999px; }
  .side .grow { flex: 1; }
  .sidelink { border: 0; background: none; color: var(--muted); text-align: left; padding: 8px; border-radius: 8px; cursor: pointer; font-weight: 600; white-space: nowrap; display: flex; gap: 10px; align-items: center; }
  .sidelink:hover { background: var(--hover); color: var(--text); } .sidelink .i { width: 26px; text-align: center; }
  .modebadge { margin: 6px 8px 10px; font: 800 10px var(--mono); color: var(--amber); letter-spacing: .08em; white-space: nowrap; }
  .runbtn { border: 0; border-radius: 8px; padding: 10px; cursor: pointer; background: #fff; color: #000; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; }
  .runbtn:disabled { opacity: .6; cursor: default; }
  .runstat { color: var(--muted); font-size: 12px; text-align: center; margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .runstat.ok { color: var(--green); } .runstat.err { color: var(--red); } .runstat.busy { color: var(--amber); }

  /* ticker */
  .ticker { grid-column: 2 / 4; display: flex; align-items: center; gap: 4px; padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--side); overflow: hidden; min-width: 0; white-space: nowrap; }
  .ticker .tl { color: var(--muted); font-weight: 700; font-size: 12px; margin-right: 8px; flex: none; }
  .tk { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 6px; font-weight: 700; font-size: 13px; border: 0; background: none; cursor: pointer; }
  .tk:hover { background: var(--hover); }
  .tk .rank { color: var(--dim); font-weight: 600; } .tk .dot { width: 7px; height: 7px; border-radius: 50%; }
  .k.entered { color: var(--green); } .k.left { color: var(--red); } .k.graduated { color: var(--violet); }
  .tk .ago { color: var(--muted); font-weight: 500; font-size: 12px; }
  .tk.more { color: var(--text); background: var(--panel2); border: 1px solid var(--line); margin-left: auto; }

  /* center */
  .center { grid-column: 2; grid-row: 2; display: flex; flex-direction: column; min-height: 0; min-width: 0; border-right: 1px solid var(--line); }
  .head { display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .head h1 { margin: 0; font-size: 18px; font-weight: 800; white-space: nowrap; }
  .head .subt { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  .stats { margin-left: auto; display: flex; gap: 18px; white-space: nowrap; }
  .stat { text-align: right; } .stat .l { color: var(--muted); font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
  .stat .v { font: 700 15px var(--mono); } .stat .d { font: 700 11px var(--mono); margin-left: 4px; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .tf { display: flex; gap: 2px; }
  .tf button { border: 0; background: none; color: var(--muted); font-weight: 600; padding: 5px 9px; border-radius: 6px; cursor: pointer; }
  .tf button:hover { color: var(--text); } .tf button.on { color: var(--blue); background: rgba(94, 160, 255, .1); }
  .sep { width: 1px; height: 20px; background: var(--line); }
  .search { display: flex; align-items: center; gap: 6px; background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 5px 9px; width: 260px; }
  .search input { border: 0; background: none; outline: none; width: 100%; }
  .bar .meta { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .twrap { flex: 1; min-height: 0; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th { height: 36px; padding: 0 10px; background: var(--panel); color: var(--text); font-size: 11.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .02em; text-align: left;
       border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; user-select: none; }
  th:hover { color: var(--blue); } th .ar { color: var(--blue); }
  th.r, td.r { text-align: right; }
  td { height: var(--row); padding: 0 10px; border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  tbody tr { cursor: pointer; } tbody tr:hover td { background: var(--hover); }
  tbody tr.sel td { background: #20222a; } tbody tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--blue); }
  td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 600; }
  .two { display: flex; flex-direction: column; line-height: 1.25; } .two > * { overflow: hidden; text-overflow: ellipsis; }
  .r .two { align-items: flex-end; }
  .sub { color: var(--muted); font-size: 11.5px; font-weight: 500; }
  .sym { font-weight: 800; } .star { color: var(--gold); margin-right: 4px; } .warn { color: var(--amber); margin-left: 5px; }
  .st { font-weight: 700; } .st.pass { color: var(--green); } .st.fail { color: var(--red); } .st.unknown { color: var(--amber); }
  .chg { font: 700 11px var(--mono); margin-left: 5px; } .chg.up { color: var(--green); } .chg.down { color: var(--red); }
  .why { color: var(--muted); } .why.ok { color: #7fd3a5; }
  .pos { color: var(--green); } .neg { color: var(--red); } .mid { color: var(--amber); }
  .empty { color: var(--muted); text-align: center; cursor: default; }
  .pager { display: flex; align-items: center; gap: 4px; padding: 7px 12px; border-top: 1px solid var(--line); }
  .pager .info { color: var(--muted); font-size: 12px; margin-right: auto; }
  .pager button { min-width: 30px; height: 28px; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; cursor: pointer; color: var(--muted); font-weight: 600; }
  .pager button:hover:not(:disabled) { color: var(--text); background: var(--hover); }
  .pager button.on { background: var(--text); color: #000; border-color: var(--text); }
  .pager button:disabled { opacity: .35; cursor: default; } .pager .gap { color: var(--dim); padding: 0 2px; }

  /* right panel */
  .right { grid-column: 3; grid-row: 2; display: flex; flex-direction: column; min-height: 0; }
  .rtabs { display: flex; border-bottom: 1px solid var(--line); }
  .rtabs button { flex: 1; border: 0; background: none; padding: 11px; cursor: pointer; color: var(--muted); font-weight: 700; border-bottom: 2px solid transparent; }
  .rtabs button.on { color: var(--text); border-bottom-color: var(--text); }
  .rbody { flex: 1; min-height: 0; overflow: hidden; padding: 12px 14px; display: flex; flex-direction: column; gap: 9px; }
  .tok { display: flex; align-items: center; gap: 10px; }
  .av { flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #0d0e11; font-size: 16px; }
  .tok .nm { font-size: 17px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tok .ds { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { font: 800 10px var(--mono); padding: 2px 6px; border-radius: 4px; margin-left: 6px; vertical-align: 2px; }
  .warnstrip { background: rgba(242, 179, 61, .1); border: 1px solid rgba(242, 179, 61, .35); color: #f6d38b; border-radius: 8px; padding: 6px 10px; font-size: 12px; }
  .lrow { display: flex; gap: 6px; }
  .lb { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 7px 6px;
        color: var(--text); text-decoration: none; font-weight: 700; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
  .lb:hover { background: var(--hover); }
  .grid { display: grid; gap: 6px; grid-template-columns: repeat(3, 1fr); }
  .box { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; text-align: center; min-width: 0; cursor: help; }
  .box .l { color: var(--muted); font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
  .box .v { font: 800 15px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .checks { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .checks.pass { border-color: rgba(47, 189, 113, .4); } .checks.fail { border-color: rgba(240, 71, 91, .35); } .checks.unknown { border-color: rgba(242, 179, 61, .35); }
  .checks .ct { font-weight: 800; margin-bottom: 4px; display: flex; justify-content: space-between; }
  .checks .ct span { color: var(--muted); font-weight: 600; font-size: 12px; }
  .ck { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 6px; align-items: baseline; font-size: 12px; line-height: 19px; cursor: help; }
  .ck .ic { font-weight: 800; text-align: center; } .ck .ic.ok { color: var(--green); } .ck .ic.bad { color: var(--red); } .ck .ic.unk { color: var(--amber); } .ck .ic.inf { color: var(--dim); }
  .ck .lb2 { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ck .val { font-family: var(--mono); font-weight: 600; white-space: nowrap; } .ck .val small { color: var(--dim); font-weight: 500; margin-left: 5px; }
  .ck.bad .lb2 { color: var(--text); }
  .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 11px; color: var(--dim); }
  .linkbtn { border: 0; background: none; color: var(--blue); cursor: pointer; padding: 0; font-weight: 600; font-size: 12px; white-space: nowrap; }
  .placeholder { color: var(--muted); text-align: center; margin-top: 40px; }

  /* filters tab */
  .presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .presets button { border: 1px solid var(--line); background: var(--panel2); border-radius: 7px; padding: 7px 4px; cursor: pointer; font-weight: 700; }
  .presets button:hover { background: var(--hover); } .presets button.on { background: #fff; color: #000; border-color: #fff; }
  .pdesc { color: var(--muted); font-size: 11.5px; margin-top: -3px; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 9px; align-content: start; overflow: auto; min-height: 0; }
  .group { grid-column: span 2; color: var(--dim); font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; margin-top: 3px; }
  .group.toggle { cursor: pointer; } .group.toggle:hover { color: var(--muted); }
  .field { min-width: 0; }
  .field label { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 11px; font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; }
  .field label > span:first-child { overflow: hidden; text-overflow: ellipsis; }
  .field .q { flex: none; width: 13px; height: 13px; border-radius: 50%; border: 1px solid var(--dim); color: var(--dim); font-size: 9px; display: inline-grid; place-items: center; cursor: help; }
  .field input[type=number], .field input[type=text] { width: 100%; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font: 600 12.5px var(--mono); }
  .field input:focus { outline: none; border-color: var(--blue); }
  .field.changed input[type=number], .field.changed input[type=text] { border-color: var(--amber); }
  .field .hint { font-size: 10.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .field .hint .rm { color: var(--red); font-weight: 700; } .field .hint .rm0 { color: var(--dim); }
  .field.bool { grid-column: span 2; display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; }
  .field.bool.changed { border-color: var(--amber); } .field.bool label { margin: 0; color: var(--text); font-size: 12px; flex: 1; }
  .field.bool .hint { margin: 0; } .field.bool input { accent-color: var(--blue); }
  .factions { display: flex; gap: 6px; }
  .factions button { flex: 1; border-radius: 7px; padding: 9px; font-weight: 700; cursor: pointer; border: 1px solid var(--line); background: var(--panel2); }
  .factions button.save { background: #fff; color: #000; border-color: #fff; }
  .fmsg { min-height: 16px; font-size: 12px; color: var(--muted); }
  .fmsg.ok { color: var(--green); } .fmsg.err { color: var(--red); }

  /* modal */
  .overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); display: none; place-items: center; z-index: 20; }
  .overlay.on { display: grid; }
  .modal { width: min(720px, 92vw); max-height: 82vh; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .modal .mh { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); font-weight: 800; font-size: 15px; }
  .modal .mh button { border: 0; background: none; color: var(--muted); font-size: 18px; cursor: pointer; }
  .modal .mb { overflow: auto; padding: 8px 16px 14px; }
  .evrow { display: grid; grid-template-columns: 10px 110px 90px 110px 60px minmax(0, 1fr); gap: 10px; align-items: center; padding: 8px 6px; border-bottom: 1px solid var(--line); cursor: pointer; border-radius: 6px; }
  .evrow:hover { background: var(--hover); } .evrow .dot { width: 8px; height: 8px; border-radius: 50%; }
  .evrow b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .evrow .m { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gl h3 { margin: 14px 0 6px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .gl dl { margin: 0; display: grid; grid-template-columns: 170px 1fr; gap: 6px 14px; } .gl dt { font-weight: 700; } .gl dd { margin: 0; color: #c9cad3; }

  @media (max-height: 800px) {  /* short laptop screens: tighter right panel so everything fits */
    .rbody { gap: 6px; padding: 9px 14px; } .fields { gap: 3px 9px; }
    .field input[type=number], .field input[type=text] { padding: 2px 8px; } .field.bool { padding: 3px 9px; }
    .presets button { padding: 5px 4px; } .factions button { padding: 7px; } .group { margin-top: 1px; }
  }
  @media (max-width: 1500px) {
    :root { --sidew: 64px; --rightw: 340px; }
    .brand span, .nav .lbl, .navlabel, .runstat, .runbtn .t, .sidelink .t, .modebadge { display: none; }
    .brand { justify-content: center; padding: 2px 0 14px; } .sidelink { justify-content: center; }
    .nav button { justify-content: center; position: relative; padding: 9px 0; }
    .nav .cnt { position: absolute; top: 0; right: 0; font-size: 9.5px; padding: 0 5px; }
    .stats { gap: 12px; } th, td { padding: 0 7px; } .search { width: 190px; }
  }
  @media (max-width: 1100px) {
    body { overflow: auto; } .app { height: auto; grid-template-columns: 1fr; grid-template-rows: auto; }
    .side, .ticker, .center, .right { grid-column: 1; grid-row: auto; } .center { min-height: 640px; } .twrap { overflow-x: auto; } table { min-width: 900px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="mark">CS</div><span>COIN SIEVE</span></div>
    <div class="modebadge admin-only">ADMIN MODE</div>
    <div class="navlabel">Tiers</div>
    <div class="nav" id="nav"></div>
    <div class="grow"></div>
    <button class="sidelink" id="glossBtn" title="What do these numbers mean?"><span class="i">ⓘ</span><span class="t">How to read this</span></button>
    <div class="admin-only">
      <button class="runbtn" id="runBtn" title="Refresh this tier now (admin)">▶<span class="t" id="runTxt">Refresh</span></button>
      <div class="runstat" id="runStatus">idle</div>
    </div>
  </aside>
  <div class="ticker" id="ticker"></div>
  <section class="center">
    <div class="head">
      <div><h1 id="title"></h1><div class="subt" id="subtitle"></div></div>
      <div class="stats" id="stats"></div>
    </div>
    <div class="bar">
      <div class="tf" id="tf"></div><div class="sep"></div>
      <label class="search"><span>⌕</span><input id="search" placeholder="Search symbol, name, address"></label>
      <span class="meta" id="meta"></span>
    </div>
    <div class="twrap" id="twrap"><table><colgroup id="cols"></colgroup><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
    <div class="pager" id="pager"></div>
  </section>
  <aside class="right">
    <div class="rtabs"><button id="tabToken" class="on">Token</button><button id="tabFilters">Filters</button></div>
    <div class="rbody" id="rbody"></div>
  </aside>
</div>
<div class="overlay" id="overlay"><div class="modal"><div class="mh"><span id="mTitle"></span><button id="mClose" title="Close">✕</button></div><div class="mb" id="mBody"></div></div></div>

<script>
"use strict";
const ADDR = /^[1-9A-HJ-NP-Za-km-z]{32,44}$/;
const ROW_H = 44, HEAD_H = 36;
const TIER = {
  new_launches: { short: "NL", color: "var(--nl)", sub: "6–48h old · passed every filter" },
  emerging: { short: "EM", color: "var(--em)", sub: "7–180 days · $1M–50M market cap" },
  established: { short: "ES", color: "var(--es)", sub: "1+ year · $200M+ market cap" },
};
const PRESET_TEXT = { strict: "Fewer tokens, stronger numbers on every check.", balanced: "The default screen.",
                      loose: "More tokens, weaker numbers — more noise." };
// Plain-language explanations (shown as tooltips and in the "How to read this" guide). Wording rules apply here too.
const EXPLAIN = {
  liquidity: "Money sitting in the trading pool, in USD. More liquidity means trades move the price less.",
  lp: "Share of the pool's money that nobody can withdraw. If the creator could withdraw it, they could empty the pool — the classic rug pull. 100% = fully locked.",
  mcap: "Price × tokens in circulation. A rough measure of the token's size.",
  fdv: "Price × every token that will ever exist, including ones not released yet.",
  volume: "Dollar value traded in the last 24 hours.",
  txns: "Number of trades (purchases and sales) in the last 24 hours.",
  holders: "Wallets that hold the token right now (Jupiter data, matches the blockchain).",
  growth: "How fast the number of holders is changing: per hour for New Launches, over 24 hours for the other tiers.",
  top10: "Share of all tokens owned by the 10 biggest wallets, not counting the trading pool. If a few wallets own a lot, their selling can crash the price.",
  top1: "Share owned by the single biggest wallet, not counting the trading pool.",
  tophold: "Share held by the biggest wallets according to Jupiter. Can include team, treasury or exchange wallets.",
  creator: "How many tokens the same creator wallet has launched. Serial launchers often abandon tokens quickly.",
  organic: "Jupiter's estimate (0–100) of how much trading comes from real users rather than bots. Higher is better.",
  mint: "Revoked = nobody can create new tokens, so holders can't be diluted by surprise.",
  freeze: "Revoked = nobody can freeze wallets, so holders can't be blocked from selling.",
  rugcheck: "RugCheck.xyz is an independent token scanner. Danger-level flags fail the check.",
  launchpad: "New tokens start on a launchpad curve (e.g. pump.fun). We only list tokens that moved to a normal trading pool.",
  socials: "Number of social links (X, Telegram, …) the project listed on DexScreener.",
  type: "Stablecoins, staking tokens and tokenised stocks are excluded — they are not project tokens.",
  age: "Time since the token's first trading pool was created.",
};
const FAIL_LABEL = { age_min: "too young", age_max: "too old", launchpad: "still on launchpad", liquidity: "low liquidity",
  volume: "low volume", txns: "few trades", socials: "no socials listed", creator: "serial creator", lp: "liquidity not locked",

    const row = el("div", "ck" + (c.ok === false && !c.info ? " bad" : ""));
    const ic = c.info ? ["•", "inf"] : c.ok === true ? ["✓", "ok"] : c.ok === false ? ["✕", "bad"] : ["?", "unk"];
    const v = el("span", "val", c.value); if (c.limit) v.append(el("small", null, c.limit));
    row.append(el("span", "ic " + ic[1], ic[0]), el("span", "lb2", c.label), v);
    row.title = (EXPLAIN[CHECK_EXPLAIN[c.id]] || "") + (c.info ? "\n(Shown for information — not a filter for this tier.)" : "");
    sec.append(row);
  }
  body.append(sec);
  const foot = el("div", "foot"), gl = el("button", "linkbtn", "ⓘ What do these numbers mean?"); gl.onclick = showGlossary;
  foot.append(gl, el("span", null, "Not financial advice")); body.append(foot);
}

// ---- right panel: filters -------------------------------------------------------------
function hintFor(f) {
  const t = S.tiers[tier].typical[f.path], parts = [];
  if (t) parts.push(`typical ${unitFmt[t.unit](t.p25)}–${unitFmt[t.unit](t.p75)}`);
  return parts.join("");
}
function isAdvanced(f) { return f.label.startsWith("Post:") || /scope_min_mcap_usd|leave_after_hours/.test(f.path); }
function activePreset() {
  const pr = S.tiers[tier].presets;
  return Object.keys(pr).find((name) => Object.entries(pr[name]).every(([p, v]) => String(edited[tier][p]) === String(v))) || null;
}
function renderFilters(body) {
  const t = S.tiers[tier], isPublic = S.mode === "public";
  const pre = el("div", "presets"), act = activePreset();
  for (const name of ["strict", "balanced", "loose"]) if (t.presets[name]) {
    const b = el("button", name === act ? "on" : "", name[0].toUpperCase() + name.slice(1)); b.title = PRESET_TEXT[name];
    b.onclick = () => { Object.assign(edited[tier], t.presets[name]); renderRight(); changed(); }; pre.append(b);
  }
  body.append(pre, el("div", "pdesc", act ? PRESET_TEXT[act] + " Presets are starting points until the track record shows what holds up." : "Custom values — pick a preset to start over."));

  const fields = el("div", "fields");
  const groups = [["Filters", (f) => f.kind !== "bool" && !isAdvanced(f)], ["Token controls", (f) => f.kind === "bool"],
                  ["Advanced", (f) => isAdvanced(f)]];
  for (const [g, test] of groups) {
    const list = t.fields.filter(test); if (!list.length) continue;
    if (g === "Advanced") {
      if (isPublic) continue;
      const h = el("div", "group toggle", (showAdvanced ? "▾ " : "▸ ") + "Advanced · daily post selection, grace periods");
      h.onclick = () => { showAdvanced = !showAdvanced; renderRight(); }; fields.append(h); if (!showAdvanced) continue;
    } else fields.append(el("div", "group", g));
    for (const f of list) fields.append(fieldEl(f));
  }
  const acts = el("div", "factions"), reset = el("button", null, isPublic ? "Back to default" : "Reset");
  reset.onclick = () => { edited[tier] = { ...t.values }; renderRight(); changed(); };
  acts.append(reset);
  if (!isPublic) { const save = el("button", "save", "Save to config"); acts.append(save);
    save.onclick = async () => { try { const j = await api("/api/config", { tier, values: edited[tier] }); t.values = j.values; edited[tier] = { ...j.values };
        renderRight(); setMsg("Saved — used from the next refresh.", "ok"); evaluate(); } catch (e) { setMsg(e.message, "err"); } }; }
  const msg = el("div", "fmsg"); msg.id = "fmsg";
  body.append(fields, acts, msg); setMsg(""); markChanged();
}
function fieldEl(f) {
  const cur = edited[tier][f.path], wrap = el("div", "field" + (f.kind === "bool" ? " bool" : "")); wrap.dataset.path = f.path;
  const id = "f_" + f.path.replaceAll(".", "_"), input = el("input"); input.id = id;
  const lab = el("label"); lab.htmlFor = id; lab.append(el("span", null, f.label.replace(/^Post: /, "")));
  if (f.help) { const q = el("span", "q", "?"); q.title = f.help; lab.append(q); }
  const hint = el("div", "hint"); hint.dataset.path = f.path;
  if (f.kind === "bool") { input.type = "checkbox"; input.checked = !!cur; input.onchange = () => { edited[tier][f.path] = input.checked; changed(); }; wrap.append(input, lab, hint); }
  else { input.type = f.kind === "num_or_null" ? "text" : "number"; input.min = "0"; input.step = "any"; input.value = cur === null ? "" : cur;
    if (f.kind === "num_or_null") input.placeholder = "no limit";
    input.oninput = () => { edited[tier][f.path] = input.value === "" ? null : input.value; changed(); }; wrap.append(lab, input, hint); }
  fillHint(hint, f); return wrap;
}
function fillHint(hint, f) {
  hint.replaceChildren(); const h = hintFor(f), rm = impact[f.path];
  if (h) hint.append(h); if (rm !== undefined) { if (h) hint.append(" · "); hint.append(el("span", rm ? "rm" : "rm0", rm ? `removes ${rm}` : "removes 0")); }
  hint.title = "Typical = middle half of the tokens checked in the last refresh. Removes = tokens that fail this filter.";
}
function refreshHints() { const fs = S.tiers[tier].fields; document.querySelectorAll(".field .hint").forEach((h) => { const f = fs.find((x) => x.path === h.dataset.path); if (f) fillHint(h, f); }); }
function markChanged() { document.querySelectorAll(".field").forEach((w) => { const p = w.dataset.path; w.classList.toggle("changed", String(edited[tier][p]) !== String(S.tiers[tier].values[p])); });
  const act = activePreset(); document.querySelectorAll(".presets button").forEach((b) => b.classList.toggle("on", b.textContent.toLowerCase() === act)); }
function changed() { markChanged(); setMsg(""); page = 0; clearTimeout(evalTimer); evalTimer = setTimeout(evaluate, 250); }
function setMsg(text, cls = "") { const m = $("fmsg"); if (!m) return; m.className = "fmsg " + cls;
  m.textContent = text || (S.mode === "public" ? "Try your own filters — the table updates instantly." : "Edits preview instantly · Save applies them from the next refresh."); }

function renderRight() {
  $("tabToken").classList.toggle("on", rightTab === "token"); $("tabFilters").classList.toggle("on", rightTab === "filters");
  const body = $("rbody"); body.replaceChildren();
  if (rightTab === "filters") renderFilters(body); else if (results) renderToken(body); else body.append(el("div", "placeholder", "Evaluating…"));
}
$("tabToken").onclick = () => { rightTab = "token"; renderRight(); };
$("tabFilters").onclick = () => { rightTab = "filters"; renderRight(); };

function renderRun() {
  if (S.mode === "public") return;
  const r = S.run; $("runBtn").disabled = r.running; $("runTxt").textContent = r.running ? "Refreshing…" : "Refresh " + S.tiers[tier].label;
  const st = $("runStatus"); st.className = "runstat " + (r.running ? "busy" : r.exit_code === 0 ? "ok" : r.exit_code ? "err" : "");
  st.textContent = r.running ? "● refreshing" : r.exit_code === 0 ? "● last refresh ok" : r.exit_code ? "● last refresh failed" : "idle"; st.title = r.tail || "";
}
function renderAll() { renderNav(); renderTicker(); renderHead(); renderTf(); renderTable(); renderRight(); renderRun(); }

// ---- actions --------------------------------------------------------------------------
async function evaluate() {
  const forTier = tier;
  try { const j = await api("/api/evaluate", { tier: forTier, values: edited[forTier] }); if (forTier !== tier) return;
    results = j.results; impact = j.impact || {}; applyPending(); renderHead(); renderTable();
    if (rightTab === "token") renderRight(); else { refreshHints(); markChanged(); } }
  catch (e) { setMsg(e.message, "err"); }
}
$("search").oninput = () => { page = 0; renderTable(); };
$("runBtn").onclick = async () => { try { const j = await api("/api/run", { tiers: [tier] }); S.run = j.run; renderRun(); pollRun(); } catch (e) { $("runStatus").textContent = e.message; } };
async function pollRun() { S.run = await api("/api/run"); renderRun(); if (S.run.running) setTimeout(pollRun, 3000); else load(); }
new ResizeObserver(() => { if (S && results) { renderTable(); renderTicker(); } }).observe($("twrap"));

async function load() {
  S = await api("/api/state");
  if (!S.mode) {  // page is newer than the running server: say so instead of breaking silently
    document.body.prepend(el("div", "fmsg err", "The dashboard server is running old code — stop it (Ctrl+C) and start it again with: python sieve.py web"));
    S.mode = "admin"; S.warn_pct = S.warn_pct ?? 50; S.disclaimer = S.disclaimer || "";
    for (const t of Object.values(S.tiers)) { t.presets = t.presets || {}; t.typical = t.typical || {}; }
  }
  document.body.classList.toggle("public", S.mode === "public");
  for (const [k, t] of Object.entries(S.tiers)) if (!edited[k]) edited[k] = { ...t.values };
  results = null; renderAll(); evaluate(); if (S.run.running) pollRun();
}
load().catch((e) => { document.body.prepend(el("div", "fmsg err", "Failed to load: " + e.message)); });
</script>
</body>
</html>
