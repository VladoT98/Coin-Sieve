<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coin Sieve</title>
<style>
  :root {
    --bg: #111215; --side: #0d0e11; --panel: #16171b; --panel2: #1c1d22; --hover: #1f2026; --line: #24252b;
    --text: #ececf1; --muted: #8b8c96; --dim: #5c5d66;
    --green: #2fbd71; --red: #f0475b; --amber: #f2b33d; --blue: #5ea0ff; --violet: #a685ff;
    --sidew: 220px; --rightw: 370px; --row: 44px;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; background: var(--bg); color: var(--text); font: 13px/1.35 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .app { height: 100vh; display: grid; grid-template-columns: var(--sidew) minmax(0, 1fr) var(--rightw); grid-template-rows: auto minmax(0, 1fr); }
  body.public .admin-only { display: none !important; }

  /* sidebar */
  .side { grid-row: 1 / 3; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 12px 10px; min-height: 0; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px 14px; font-weight: 800; font-size: 17px; letter-spacing: .04em; white-space: nowrap; }
  .brand .mark { flex: none; width: 30px; height: 30px; border-radius: 8px; background: #fff; color: #000; display: grid; place-items: center; font-size: 12px; font-weight: 900; letter-spacing: 0; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav a { display: flex; align-items: center; gap: 11px; border-radius: 8px; padding: 9px 8px; color: var(--muted); font-weight: 600; font-size: 14px; text-decoration: none; }
  .nav a:hover { background: var(--hover); color: var(--text); }
  .nav a.on { background: var(--panel2); color: var(--text); }
  .nav .ico { flex: none; width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: #26272e; color: var(--text); }
  .nav .lbl { flex: 1; white-space: nowrap; }
  .nav .cnt { font: 700 11px var(--mono); color: var(--muted); background: #22232a; padding: 1px 7px; border-radius: 999px; }
  .side .grow { flex: 1; }
  .sidelink { border: 0; background: none; color: var(--muted); text-align: left; padding: 8px; border-radius: 8px; cursor: pointer; font-weight: 600; white-space: nowrap; display: flex; gap: 10px; align-items: center; }
  .sidelink:hover { background: var(--hover); color: var(--text); } .sidelink .i { width: 26px; text-align: center; }
  .modebadge { margin: 6px 8px 10px; font: 800 10px var(--mono); color: var(--amber); letter-spacing: .08em; white-space: nowrap; }
  .runbtn { border: 0; border-radius: 8px; padding: 10px; cursor: pointer; background: #fff; color: #000; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; width: 100%; }
  .runbtn:disabled { opacity: .6; cursor: default; }
  .runstat { color: var(--muted); font-size: 12px; text-align: center; margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .runstat.ok { color: var(--green); } .runstat.err { color: var(--red); } .runstat.busy { color: var(--amber); }

  /* market strip */
  .market { grid-column: 2 / 4; display: grid; grid-template-columns: 1.1fr 1fr 1fr 1fr; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--side); min-width: 0; }
  .mcard { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; min-width: 0; cursor: help; }
  .mcard.stale { opacity: .55; }
  .mcard .mt { color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mcard .big { font: 800 19px var(--mono); white-space: nowrap; }
  .mrow { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 2px 0; white-space: nowrap; }
  .mrow .ml { color: var(--muted); font-size: 12px; } .mrow .mv { font: 700 14px var(--mono); }
  .mchg { font: 700 11.5px var(--mono); margin-left: 6px; }
  .fng { display: flex; align-items: center; gap: 12px; } .fng svg { flex: none; }
  .fng .lbl { display: inline-block; margin-top: 3px; padding: 1px 7px; border-radius: 5px; font-size: 11.5px; font-weight: 700; color: #0d0e11; }
  .fng .yd { color: var(--muted); font-size: 11.5px; margin-top: 4px; }

  /* center */
  .center { grid-column: 2; grid-row: 2; display: flex; flex-direction: column; min-height: 0; min-width: 0; border-right: 1px solid var(--line); }
  .app.wide .center { grid-column: 2 / 4; border-right: 0; } .app.wide .right { display: none; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .tf { display: flex; gap: 2px; }
  .tf button { border: 0; background: none; color: var(--muted); font-weight: 600; padding: 5px 9px; border-radius: 6px; cursor: pointer; }
  .tf button:hover { color: var(--text); } .tf button.on { color: var(--blue); background: rgba(94, 160, 255, .1); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: var(--panel2); border-radius: 999px; padding: 4px 11px; cursor: pointer; color: var(--muted); font-weight: 600; font-size: 12px; white-space: nowrap; }
  .chip:hover:not(:disabled) { color: var(--text); } .chip.on { background: rgba(94, 160, 255, .14); color: var(--blue); border-color: rgba(94, 160, 255, .45); }
  .chip:disabled { opacity: .45; cursor: not-allowed; }
  .sep { width: 1px; height: 20px; background: var(--line); }
  .search { display: flex; align-items: center; gap: 6px; background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 5px 9px; width: 240px; }
  .search input { border: 0; background: none; outline: none; width: 100%; }
  .bar .meta { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; } .bar .meta.stale { color: var(--amber); }
  .twrap { flex: 1; min-height: 0; overflow: hidden; }
  table.list { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .list th { height: 36px; padding: 0 10px; background: var(--panel); color: var(--text); font-size: 11.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .02em; text-align: left;
       border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; cursor: pointer; user-select: none; }
  .list th .thw { display: flex; align-items: center; gap: 4px; min-width: 0; } .list th.r .thw { justify-content: flex-end; }
  .list th .ar { color: var(--blue); flex: none; }
  .hl { border: 0; background: none; padding: 0; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; cursor: help; min-width: 0;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-decoration: underline dotted; text-decoration-color: #6d6e78; text-underline-offset: 4px; }
  .hl:hover, .hl[aria-expanded="true"] { color: var(--blue); }
  .list th.r, .list td.r { text-align: right; }
  .list td { height: var(--row); padding: 0 10px; border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list tbody tr { cursor: pointer; } .list tbody tr:hover td { background: var(--hover); }
  .list tbody tr.sel td { background: #20222a; } .list tbody tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--blue); }
  td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 600; }
  .two { display: flex; flex-direction: column; line-height: 1.25; } .two > * { overflow: hidden; text-overflow: ellipsis; }
  .r .two { align-items: flex-end; }
  .sub { color: var(--muted); font-size: 11.5px; font-weight: 500; }
  .sym { font-weight: 800; } .chain { font: 700 9.5px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 6px; vertical-align: 1px; }
  .miss { color: #f08a96; }
  .pos { color: var(--green); } .neg { color: var(--red); }
  .px .pv { font: 700 13.5px var(--mono); color: var(--text); }
  .sparkcell { display: flex; align-items: center; justify-content: flex-end; gap: 7px; } .sparkcell.stale { opacity: .5; }
  .sparkwrap svg { display: block; width: 64px; height: 26px; }
  .spark.up { color: var(--green); } .spark.down { color: var(--red); } .spark.flat { color: var(--muted); }
  .doc { font-weight: 600; } .doc .y { color: var(--green); margin-right: 5px; } .doc .n { color: var(--dim); margin-right: 5px; }
  .empty { color: var(--muted); text-align: center; cursor: default; }
  .pager { display: flex; align-items: center; gap: 4px; padding: 7px 12px; border-top: 1px solid var(--line); }
  .pager .info { color: var(--muted); font-size: 12px; margin-right: auto; }
  .pager button { min-width: 30px; height: 28px; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; cursor: pointer; color: var(--muted); font-weight: 600; }
  .pager button:hover:not(:disabled) { color: var(--text); background: var(--hover); }
  .pager button.on { background: var(--text); color: #000; border-color: var(--text); }
  .pager button:disabled { opacity: .35; cursor: default; } .pager .gap { color: var(--dim); padding: 0 2px; }
  .disc { padding: 7px 12px; border-top: 1px solid var(--line); color: var(--dim); font-size: 11.5px; text-align: center; }

  /* header tooltip popover */
  .tip { position: fixed; z-index: 30; width: 300px; max-width: calc(100vw - 16px); background: var(--panel2); border: 1px solid #383943; border-radius: 10px; padding: 11px 13px;
         box-shadow: 0 10px 28px rgba(0, 0, 0, .55); font-size: 12.5px; line-height: 1.45; }
  .tip[hidden] { display: none; }
  .tip h4 { margin: 0 0 5px; font-size: 13px; } .tip p { margin: 0 0 9px; color: #c9cad3; }
  .tip .ta { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .tip a { color: var(--blue); text-decoration: none; font-weight: 700; } .tip a:hover { text-decoration: underline; }
  .tip button { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 3px 9px; cursor: pointer; color: var(--muted); font-weight: 600; font-size: 12px; }
  .tip button:hover { color: var(--text); }

  /* methodology */
  .article { flex: 1; min-height: 0; overflow: auto; padding: 22px 32px 30px; }
  .article .inner { max-width: 820px; }
  .article h1 { margin: 0 0 6px; font-size: 24px; } .article .lead { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
  .article h2 { margin: 26px 0 8px; font-size: 16px; scroll-margin-top: 14px; } .article p { color: #c9cad3; line-height: 1.6; margin: 0 0 10px; font-size: 13.5px; }
  .article h2:focus { outline: none; } .article h2.flash { animation: hl 1.6s; } @keyframes hl { from { color: var(--blue); } }
  .toc { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; } .toc a { color: var(--muted); text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; } .toc a:hover { color: var(--text); }
  table.kv { border-collapse: collapse; margin: 6px 0 12px; width: 100%; } .kv th, .kv td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 12.5px; }
  .kv th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; } .kv td.m { font-family: var(--mono); }
  .kv td:first-child { width: 34%; }

  /* right panel */
  .right { grid-column: 3; grid-row: 2; display: flex; flex-direction: column; min-height: 0; }
  .rtabs { display: flex; border-bottom: 1px solid var(--line); }
  .rtabs button { flex: 1; border: 0; background: none; padding: 11px; cursor: pointer; color: var(--muted); font-weight: 700; border-bottom: 2px solid transparent; }
  .rtabs button.on { color: var(--text); border-bottom-color: var(--text); }
  .rbody { flex: 1; min-height: 0; overflow: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 9px; }
  .tok { display: flex; align-items: center; gap: 10px; }
  .av { flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #0d0e11; font-size: 16px; }
  .av, .coin { position: relative; overflow: hidden; }
  .av img, .coin img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .coin { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 800 10px var(--mono); color: #0d0e11; }
  .tokcell { display: flex; align-items: center; gap: 8px; min-width: 0; } .tokcell .two { min-width: 0; }
  .tok .nm { font-size: 17px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tok .ds { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pricebig { display: flex; align-items: baseline; gap: 8px; } .pricebig .v { font: 800 20px var(--mono); } .pricebig .c { font: 700 12.5px var(--mono); } .pricebig .t { color: var(--dim); font-size: 11.5px; margin-left: auto; }
  .linkchips { display: flex; flex-wrap: wrap; gap: 6px; }
  .lc { display: inline-flex; align-items: center; gap: 5px; background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 5px 9px; color: var(--text); text-decoration: none; font-weight: 700; font-size: 12px; white-space: nowrap; cursor: help; }
  a.lc { cursor: pointer; } a.lc:hover { background: var(--hover); }
  .lc .y { color: var(--green); } .lc.no { color: var(--dim); } .lc.no .n { color: var(--dim); }
  .lrow { display: flex; gap: 6px; }
  .lb { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 7px 6px;
        color: var(--text); text-decoration: none; font-weight: 700; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
  .lb:hover { background: var(--hover); }
  .grid { display: grid; gap: 6px; grid-template-columns: repeat(3, 1fr); }
  .box { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; text-align: center; min-width: 0; cursor: help; }
  .box .l { color: var(--muted); font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
  .box .v { font: 800 15px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .checks { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .checks.pass { border-color: rgba(47, 189, 113, .4); } .checks.fail { border-color: rgba(240, 71, 91, .35); } .checks.unknown { border-color: rgba(242, 179, 61, .35); }
  .checks .ct { font-weight: 800; margin-bottom: 4px; display: flex; justify-content: space-between; }
  .checks .ct span { color: var(--muted); font-weight: 600; font-size: 12px; }
  .ck { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 6px; align-items: baseline; font-size: 12px; line-height: 19px; }
  .ck .ic { font-weight: 800; text-align: center; } .ck .ic.ok { color: var(--green); } .ck .ic.bad { color: var(--red); } .ck .ic.unk { color: var(--amber); } .ck .ic.inf { color: var(--dim); }
  .ck .lb2 { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ck .val { font-family: var(--mono); font-weight: 600; white-space: nowrap; } .ck .val small { color: var(--dim); font-weight: 500; margin-left: 5px; }
  .ck.bad .lb2 { color: var(--text); } .ck.inf .lb2 { color: var(--dim); }
  .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 11px; color: var(--dim); }
  .linkbtn { border: 0; background: none; color: var(--blue); cursor: pointer; padding: 0; font-weight: 600; font-size: 12px; white-space: nowrap; }
  .placeholder { color: var(--muted); text-align: center; margin-top: 40px; }

  /* filters tab */
  .pdesc { color: var(--muted); font-size: 11.5px; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 9px; align-content: start; }
  .group { grid-column: span 2; color: var(--dim); font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; margin-top: 6px; }
  .field { min-width: 0; }
  .field label { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 11px; font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; }
  .field label > span:first-child { overflow: hidden; text-overflow: ellipsis; }
  .field .q { flex: none; width: 13px; height: 13px; border-radius: 50%; border: 1px solid var(--dim); color: var(--dim); font-size: 9px; display: inline-grid; place-items: center; cursor: help; }
  .field input[type=number], .field input[type=text] { width: 100%; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font: 600 12.5px var(--mono); }
  .field input:focus { outline: none; border-color: var(--blue); }
  .field.changed input[type=number], .field.changed input[type=text] { border-color: var(--amber); }
  .field .hint { font-size: 10.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .field.bool { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; }
  .field.bool.wide { grid-column: span 2; }
  .field.bool.changed { border-color: var(--amber); } .field.bool label { margin: 0; color: var(--text); font-size: 12px; flex: 1; }
  .field.bool input { accent-color: var(--blue); }
  .factions { display: flex; gap: 6px; }
  .factions button { flex: 1; border-radius: 7px; padding: 9px; font-weight: 700; cursor: pointer; border: 1px solid var(--line); background: var(--panel2); }
  .factions button.save { background: #fff; color: #000; border-color: #fff; }
  .fmsg { min-height: 16px; font-size: 12px; color: var(--muted); }
  .fmsg.ok { color: var(--green); } .fmsg.err { color: var(--red); }

  /* modal */
  .overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); display: none; place-items: center; z-index: 20; }
  .overlay.on { display: grid; }
  .modal { width: min(720px, 92vw); max-height: 82vh; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .modal .mh { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); font-weight: 800; font-size: 15px; }
  .modal .mh button { border: 0; background: none; color: var(--muted); font-size: 18px; cursor: pointer; }
  .modal .mb { overflow: auto; padding: 8px 16px 14px; }
  .colbtn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel2); border-radius: 7px; padding: 5px 10px; cursor: pointer; color: var(--muted); font-weight: 700; font-size: 12px; white-space: nowrap; }
  .colbtn:hover { color: var(--text); background: var(--hover); }
  .bo { color: #4fb8b2; } .so { color: #c98a5a; }   /* bought / sold: neutral teal / copper, not green / red */

  /* column picker (modal) */
  .picker { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; padding-top: 6px; }
  .picker h3 { margin: 12px 0 5px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .picker h3:first-child { margin-top: 2px; }
  .pk { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 6px; }
  .pk:hover { background: var(--hover); } .pk input { accent-color: var(--blue); margin: 0; }
  .pk.off { opacity: .45; }
  .pk .hl { text-transform: none; letter-spacing: 0; font-weight: 600; font-size: 13px; }
  .pnote { color: var(--muted); font-size: 12px; margin: 2px 0 8px; } .pnote.warn { color: var(--amber); }
  .order { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .order li { display: flex; align-items: center; gap: 8px; background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 5px 6px 5px 8px; cursor: grab; }
  .order li.fixed { cursor: default; opacity: .6; } .order li.drag { opacity: .4; } .order li.over { border-color: var(--blue); }
  .order .grip { color: var(--dim); font-size: 12px; } .order .nm2 { flex: 1; font-weight: 700; font-size: 12.5px; }
  .order .grp { color: var(--dim); font-size: 11px; }
  .order button { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 2px 5px; border-radius: 5px; font-size: 12px; }
  .order button:hover:not(:disabled) { color: var(--text); background: var(--hover); } .order button:disabled { opacity: .25; cursor: default; }
  .pfoot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  .pfoot .sub { margin-right: auto; }
  .pfoot button { border: 1px solid var(--line); background: var(--panel2); border-radius: 7px; padding: 7px 14px; cursor: pointer; font-weight: 700; }
  .pfoot button.done { background: #fff; color: #000; border-color: #fff; }
  @media (max-width: 700px) { .picker { grid-template-columns: 1fr; } }
  .gl h3 { margin: 14px 0 6px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .gl dl { margin: 0; display: grid; grid-template-columns: 170px 1fr; gap: 6px 14px; } .gl dt { font-weight: 700; } .gl dd { margin: 0; color: #c9cad3; }

  @media (max-width: 1500px) {
    :root { --sidew: 64px; --rightw: 340px; }
    .brand span, .nav .lbl, .runstat, .runbtn .t, .sidelink .t, .modebadge { display: none; }

    const row = el("div", "ck" + (c.info ? " inf" : c.ok === false ? " bad" : ""));
    const ic = c.info ? [c.ok ? "✓" : "•", "inf"] : c.ok === true ? ["✓", "ok"] : c.ok === false ? ["✕", "bad"] : ["?", "unk"];
    const v = el("span", "val", c.value); if (c.limit) v.append(el("small", null, c.limit));
    row.append(el("span", "ic " + ic[1], ic[0]), el("span", "lb2", c.label), v);
    if (c.info) row.title = T.panel.facts_note;
    sec.append(row);
  }
  body.append(sec);
  const foot = el("div", "foot"), gl = el("button", "linkbtn", "ⓘ " + T.panel.glossary_link); gl.onclick = showGlossary;
  foot.append(gl, el("span", null, T.disclaimer)); body.append(foot);
}

// ---- right panel: filters (visitor filters + admin coverage criteria) ---------------------------------------------
function numField(label, value, onInput, help) {
  const wrap = el("div", "field"), id = "f" + Math.random().toString(36).slice(2), input = el("input"), lab = el("label");
  lab.htmlFor = id; lab.append(el("span", null, label)); if (help) { const q = el("span", "q", "?"); q.title = help; lab.append(q); }
  input.id = id; input.type = "number"; input.min = "0"; input.step = "any"; input.value = value ?? ""; input.oninput = () => onInput(input.value === "" ? null : Number(input.value));
  wrap.append(lab, input); return wrap;
}
function boolField(label, value, onChange, wide = false) {
  const wrap = el("div", "field bool" + (wide ? " wide" : "")), id = "f" + Math.random().toString(36).slice(2), input = el("input"), lab = el("label", null, label);
  input.type = "checkbox"; input.id = id; input.checked = !!value; input.onchange = () => onChange(input.checked); lab.htmlFor = id;
  wrap.append(input, lab); return wrap;
}
function filtersChanged() { page = 0; if (route.name === "tokens") renderTokensView(); if (rightTab === "filters") renderRight(); }
function renderFilters(body) {
  const ft = T.filters, fields = el("div", "fields");
  body.append(el("div", "pdesc", ft.intro));
  fields.append(numField(ft.max_top10, F.maxTop10, (v) => { F.maxTop10 = v; filtersChangedSoft(); }, T.columns.top10.body),
                numField(ft.min_holders, F.minHolders, (v) => { F.minHolders = v; filtersChangedSoft(); }),
                numField(ft.min_mcap, F.minMcap, (v) => { F.minMcap = v; filtersChangedSoft(); }), el("div"));
  for (const [k, l] of [["website", ft.has_website], ["whitepaper", ft.has_whitepaper], ["docs", ft.has_docs], ["github", ft.has_github], ["x", ft.has_x]])
    fields.append(boolField(l, F[k], (v) => { F[k] = v; filtersChangedSoft(); }));
  body.append(fields);
  const acts = el("div", "factions"), reset = el("button", null, ft.reset); reset.onclick = () => { F = { ...DEF }; filtersChanged(); renderRight(); }; acts.append(reset); body.append(acts);
  if (S.mode !== "public") renderCriteria(body);
}
function filtersChangedSoft() { page = 0; if (route.name === "tokens") renderTokensView(); }  // keep input focus in the panel
function renderCriteria(body) {
  const ft = T.filters, fields = el("div", "fields");
  fields.append(el("div", "group", ft.admin_title));
  for (const f of S.fields) {
    const changed = String(edited[f.path]) !== String(S.criteria[f.path]);
    const w = f.kind === "bool" ? boolField(f.label, edited[f.path], (v) => { edited[f.path] = v; criteriaChanged(); }, true)
                                : numField(f.label, edited[f.path], (v) => { edited[f.path] = v; criteriaChanged(); }, f.help);
    if (changed) w.classList.add("changed"); w.dataset.path = f.path; fields.append(w);
  }
  body.append(fields);
  const n = S.tokens.filter(covered).length, m = S.members;
  const msg = el("div", "fmsg"); msg.id = "fmsg"; msg.textContent = isEdited() ? fill(ft.admin_covers, { n, m }) : ft.admin_intro;
  const acts = el("div", "factions"), reset = el("button", null, ft.reset_criteria), save = el("button", "save", ft.save);
  reset.onclick = () => { edited = { ...S.criteria }; whatIf = null; renderAll(); };
  save.onclick = async () => { try { const j = await api("/api/config", { tier: "coverage", values: edited });
      S.criteria = j.values; edited = { ...j.values }; msg.className = "fmsg ok"; msg.textContent = T.filters.saved; } catch (e) { msg.className = "fmsg err"; msg.textContent = e.message; } };
  acts.append(reset, save); body.append(acts, msg);
}
function criteriaChanged() {
  document.querySelectorAll(".field[data-path]").forEach((w) => w.classList.toggle("changed", String(edited[w.dataset.path]) !== String(S.criteria[w.dataset.path])));
  clearTimeout(evalTimer); evalTimer = setTimeout(evaluate, 250);
}
async function evaluate() {
  if (!isEdited()) { whatIf = null; renderTokensIfShown(); updateCoversMsg(); return; }
  try { const j = await api("/api/evaluate", { tier: "coverage", values: edited }); whatIf = j.results; impact = j.impact || {}; renderTokensIfShown(); updateCoversMsg(); }
  catch (e) { const m = $("fmsg"); if (m) { m.className = "fmsg err"; m.textContent = e.message; } }
}
function updateCoversMsg() { const m = $("fmsg"); if (!m) return; m.className = "fmsg";
  m.textContent = isEdited() ? fill(T.filters.admin_covers, { n: S.tokens.filter(covered).length, m: S.members }) : T.filters.admin_intro; }
function renderTokensIfShown() { if (route.name === "tokens") renderTable(); }

function renderRight() {
  $("tabToken").classList.toggle("on", rightTab === "token"); $("tabFilters").classList.toggle("on", rightTab === "filters");
  $("tabToken").setAttribute("aria-selected", rightTab === "token"); $("tabFilters").setAttribute("aria-selected", rightTab === "filters");
  const body = $("rbody"); body.replaceChildren();
  if (rightTab === "filters") renderFilters(body); else renderToken(body);
}
$("tabToken").onclick = () => { rightTab = "token"; renderRight(); };
$("tabFilters").onclick = () => { rightTab = "filters"; renderRight(); };

function renderRun() {
  if (S.mode === "public" || !S.run) return;
  const r = S.run; $("runBtn").disabled = r.running; $("runTxt").textContent = r.running ? "Refreshing…" : "Refresh";
  const st = $("runStatus"); st.className = "runstat " + (r.running ? "busy" : r.exit_code === 0 ? "ok" : r.exit_code ? "err" : "");
  st.textContent = r.running ? "● refreshing" : r.exit_code === 0 ? "● last refresh ok" : r.exit_code ? "● last refresh failed" : "idle"; st.title = r.tail || "";
}
function renderAll() {
  $("app").classList.toggle("wide", route.name === "methodology");
  renderNav();
  if (route.name === "methodology") renderMethodology(); else { renderTokensView(); renderRight(); }
  renderRun();
}

// ---- actions ---------------------------------------------------------------------------------------------
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeModal(); hideTip(); } });
$("runBtn").onclick = async () => { try { const j = await api("/api/run", { tiers: ["coverage"] }); S.run = j.run; renderRun(); pollRun(); } catch (e) { $("runStatus").textContent = e.message; } };
async function pollRun() { S.run = await api("/api/run"); renderRun(); if (S.run && S.run.running) setTimeout(pollRun, 3000); else load(); }

async function load() {
  const next = await api("/api/state");
  if (!next.texts) {  // page is newer than the running server: say so instead of breaking silently
    document.body.prepend(el("div", "fmsg err", "The dashboard server is running old code — stop it (Ctrl+C) and start it again with: python sieve.py web")); return;
  }
  S = next; T = S.texts;
  document.body.classList.toggle("public", S.mode === "public");
  if (S.mode !== "public" && (!edited || !isEdited())) { edited = { ...S.criteria }; whatIf = null; }
  if (!chosen) loadColumns();
  renderAll(); renderMarket();
  if (S.run && S.run.running) pollRun();
}
parseRoute();
load().catch((e) => { document.body.prepend(el("div", "fmsg err", "Failed to load: " + e.message)); });
loadMarket();
setInterval(() => { if (!document.hidden && route.name === "tokens" && !isEdited() && !document.activeElement.closest(".rbody")) load().catch(() => {}); }, 120000);
</script>
</body>
</html>
