# Every text the website shows. One place, so the wording tests (tests/test_site_text.py) can check all of it.
# Rules: neutral facts, plain language, no advice or predictions, no quality judgements.
# Never use: safe, gem, verified, buy, healthy, good tokenomics, strong, undervalued, bullish, bearish,
# risk/reward, recommended. Watch for words that contain them (e.g. "management" contains "gem").

brand: Coin Sieve
tagline: Established crypto tokens, explained in plain language.
disclaimer: Not financial advice. Not a recommendation.
attribution: Market data powered by CoinGecko.

nav:
  tokens: Tokens
  methodology: Methodology
  quality: Quality score
  glossary: How to read this

# Column header tooltips: title, 1-3 plain sentences, "Learn more" anchor on the Methodology page.
columns:
  token:
    short: Token
    title: Token
    body: The ticker and name the project uses, and the blockchain it is issued on (“own chain” for the coin of its own blockchain, such as Bitcoin). Anyone can copy a name, so the contract address on the token page is what identifies a token.
    more: coverage
  price:
    short: Price
    title: Price
    body: Price in US dollars from CoinGecko, which combines the markets it tracks, at the time shown. It updates when the list is refreshed, not live.
    more: prices
  mcap:
    short: Market cap
    title: Market cap
    body: Price × tokens in circulation. A rough measure of the token's size today; tokens that are still locked or not yet released are not included.
    more: prices
  change_1h:
    short: 1h %
    title: 1h change
    body: Price change over the last hour, from CoinGecko. It describes the past hour only.
    more: prices
  change_24h:
    short: 24h %
    title: 24h change
    body: Price change over the last 24 hours, from CoinGecko. It describes the past day only.
    more: prices
  change_7d:
    short: 7d %
    title: 7d change
    body: Price change over the last 7 days, from the first to the last hourly price in CoinGecko's 7-day series. It is the same series as the 7-day line.
    more: prices
  chart_7d:
    short: Last 7 days
    title: Last 7 days
    body: Hourly prices over the last 7 days from CoinGecko, combined across the markets it tracks.
    more: prices
  top10:
    short: Top 10
    title: Top 10 holders
    body: Share of all tokens held by the 10 largest wallets, after leaving out wallets we can identify as trading pools, smart contracts (locks, staking) or listed exchanges. Shown only for tokens issued on Solana; team and treasury wallets we cannot identify stay in. "≥" means the data held fewer than 10 such wallets, so the real share is at least this.
    more: holders
  exchanges:
    short: Markets
    title: Markets traded on
    body: Number of different exchanges, centralised and decentralised, where the token trades, among the first 100 trading pairs CoinGecko lists. Pairs CoinGecko marks as stale or unusual are not counted.
    more: coverage
  rank:
    short: Rank
    title: Market cap rank
    body: Position by market cap among all coins CoinGecko tracks, including stablecoins and other assets this list leaves out.
    more: prices
  unlock:
    short: Unlock
    title: Next unlock
    body: "The next scheduled release of locked tokens (for example team or investor allocations) into circulation. Source: DefiLlama's public unlock schedules, which list only some projects (about 14 of the tokens checked here) and are not loaded yet, so the column shows “–”. Admin view only until DefiLlama's terms of use are cleared."
    more: unlocks
  docs:
    short: Docs
    title: Docs
    body: Whether a whitepaper or documentation site was found through the project's own links. ✓ means a link was found, not that its content was checked.
    more: links
  fdv:
    short: FDV
    title: Fully diluted value
    body: Price × every token that will ever exist, including ones not released yet. The gap to market cap shows how much supply is still to come.
    more: prices
  volume:
    short: Volume (24h)
    title: Volume 24h
    body: Dollar value traded in the last 24 hours across all markets CoinGecko tracks.
    more: prices
  circ_supply:
    short: Circ. supply
    title: Circulating supply
    body: Tokens in circulation now (CoinGecko). Locked or not yet released tokens are not included.
    more: supply
  max_supply:
    short: Max
    title: Maximum supply
    body: The most tokens that can ever exist, as published on CoinGecko. “–” when no maximum is published.
    more: supply
  circ_pct:
    short: Circ. %
    title: Share in circulation
    body: Circulating supply as a share of the maximum supply, or of the total supply when no maximum is published. Below 100% means more tokens can still enter circulation.
    more: supply
  age:
    short: Age
    title: Age
    body: "At least this many days: time since the token's first recorded price on CoinGecko (from its all-time high and low dates, its genesis date and its 1-year price history)."
    more: coverage

