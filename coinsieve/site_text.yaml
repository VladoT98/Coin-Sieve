# Every text the website shows. One place, so the wording tests (tests/test_site_text.py) can check all of it.
# Rules: neutral facts, plain language, no advice or predictions, no quality judgements.
# Never use: safe, gem, verified, buy, healthy, good tokenomics, strong, undervalued, bullish, bearish,
# risk/reward, recommended. Watch for words that contain them (e.g. "management" contains "gem").

brand: Coin Sieve
tagline: Established crypto tokens, explained in plain language.
disclaimer: Not financial advice. Not a recommendation.

nav:
  tokens: Tokens
  methodology: Methodology
  glossary: How to read this

# Column header tooltips: title, 1-3 plain sentences, "Learn more" anchor on the Methodology page.
columns:
  token:
    short: Token
    title: Token
    body: The ticker and name the project uses, and the blockchain it is issued on. Anyone can copy a name, so the contract address is what identifies a token.
    more: coverage
  price:
    short: Price
    title: Price
    body: Last traded price in US dollars from Jupiter, Solana's largest trading aggregator, at the time shown. It updates when the list is refreshed, not live.
    more: prices
  mcap:
    short: MCap
    title: Market cap
    body: Price × tokens in circulation. A rough measure of the token's size today; tokens that are still locked or not yet released are not included.
    more: prices
  change_24h:
    short: 24h
    title: 24h change
    body: Price change over the last 24 hours, from Jupiter. It describes the past day only.
    more: prices
  chart_7d:
    short: 7d
    title: 7d price
    body: Hourly closing prices over the last 7 days from the token's largest trading pool (GeckoTerminal). The % compares the first and last point of this same line.
    more: prices
  top10:
    short: Top 10
    title: Top 10 holders
    body: Share of all tokens held by the 10 largest wallets, after leaving out wallets we can identify as trading pools, smart contracts (locks, staking) or listed exchanges. Team and treasury wallets we cannot identify stay in. "≥" means the data held fewer than 10 such wallets, so the real share is at least this.
    more: holders
  holders:
    short: Holders
    title: Holders
    body: Wallets holding a balance right now (Jupiter data, which matches the blockchain). One person can use many wallets, and one exchange wallet can stand for many people.
    more: holders
  unlock:
    short: Unlock
    title: Next unlock
    body: "The next scheduled release of locked tokens (for example team or investor allocations) into circulation. Source: DefiLlama's public unlock schedules, which list only some projects (about 14 of the tokens checked here) and are not loaded yet, so the column shows “–”. Admin view only until DefiLlama's terms of use are cleared."
    more: unlocks
  docs:
    short: Docs
    title: Docs
    body: Whether a whitepaper or documentation site was found through the project's own links. ✓ means a link was found, not that its content was checked.
    more: links
  fdv:
    short: FDV
    title: Fully diluted value
    body: Price × every token that will ever exist, including ones not released yet. The gap to market cap shows how much supply is still to come.
    more: prices
  liquidity:
    short: Liquidity
    title: Liquidity
    body: Money sitting in the token's trading pools, in US dollars (Jupiter). More liquidity means a trade moves the price less.
    more: prices
  volume:
    short: Volume
    title: Volume 24h
    body: Dollar value traded in the last 24 hours across all pools Jupiter tracks.
    more: prices
  bought_sold:
    short: Bought / sold
    title: Bought / sold 24h
    body: The last 24 hours of trading split into the dollar value bought (upper line) and sold (lower line), from Jupiter. A side with no trades shows $0.
    more: prices
  holder_change:
    short: Holders Δ
    title: Holder change 24h
    body: Change in the number of wallets holding the token over the last 24 hours, in percent (Jupiter).
    more: holders
  circ_supply:
    short: Circ.
    title: Circulating supply
    body: Tokens in circulation now (Jupiter). Locked or not yet released tokens are not included.
    more: supply
  max_supply:
    short: Max
    title: Maximum supply
    body: The most tokens that can ever exist, as published on CoinGecko. “–” when no maximum is published.
    more: supply
  circ_pct:
    short: Circ. %
    title: Share in circulation
    body: Circulating supply as a share of the maximum supply, or of the total supply when no maximum is published. Below 100% means more tokens can still enter circulation.
    more: supply
  age:
    short: Age
    title: Age
    body: Days since the token's first trading pool was created (Jupiter).
    more: coverage

