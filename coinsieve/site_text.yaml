glossary:
  - heading: The list
    items:
      - [Covered, A token that meets every coverage criterion on the Methodology page. Being covered means the token is old and large enough to profile. It says nothing about whether it is worth holding.]
      - [Just outside, Admin view only. Tokens that were checked but miss at least one criterion.]
  - heading: Numbers
    items:
      - [Price, Price in US dollars (CoinGecko, combined across markets), at the time shown.]
      - [Market cap, Price × tokens in circulation. A rough measure of the token's size.]
      - [FDV, "Fully diluted value: price × every token that will ever exist, including ones not released yet."]
      - [Volume 24h, Dollar value traded in the last 24 hours.]
      - [Markets traded on, "Different exchanges where the token trades. A token on many exchanges does not depend on one venue."]
      - [Top 10 holders, "Share of all tokens held by the 10 largest wallets, leaving out identified trading pools, contracts and exchanges. Solana tokens only."]
      - [7d price, Hourly prices over 7 days from CoinGecko.]
  - heading: Facts
    items:
      - [Own chain, "The coin of its own blockchain, such as Bitcoin or Zcash, as opposed to a token issued on another chain (for example an Ethereum token)."]
      - [Mint authority revoked, "Solana tokens: nobody can create new tokens any more, so the supply cannot be increased by surprise."]
      - [Freeze authority revoked, "Solana tokens: nobody can freeze holders' wallets."]
      - [Whitepaper, A document in which the project describes itself and usually its token supply. Coin Sieve finds it through the project's own links.]

market:
  fng: "A third-party gauge of the overall crypto market's mood, from 0 (extreme fear) to 100 (extreme greed), built from price swings, momentum, social media and search trends. Updated once a day. It describes the mood — not where prices go next."
  mktcap: Combined market value of all tracked cryptocurrencies, its change over 24 hours, and the dollar value traded in the last 24 hours.
  oi: "Open interest: the dollar value of futures and perpetual contracts that are still open. Total = summed across about 100 derivatives exchanges. Solana = SOL perpetual contracts on the two largest venues for them."
  dvol: "Dollar value of futures and perpetual contracts traded in the last 24 hours. Total = all derivatives exchanges summed. Solana = SOL perpetual contracts on the two largest venues for them."

methodology:
  title: Methodology
  intro: How Coin Sieve picks the tokens it covers, where every number comes from, and what it cannot tell you.
  contents: On this page
  criterion: Criterion
  value: Value now
  min_days: "{n} days or older"
  or_more: "{v} or more"
  required: Required
  not_required: Not required
  excluded: "Excluded CoinGecko categories: {cats}. These tokens stand for another asset (a currency, another coin, a fund, a stock or a commodity) rather than a project of their own."
  min_markets: "{n} or more"
  grace: Grace period before a token leaves the list
  grace_value: "{n} hours"
  source: Source
  provides: Provides
  cadence: Updated
  last: Last fetched
  never: not yet
  ago: "{ago} ago"
  point: Point
  shown_when: Shown when
  pt_top10: "The 10 largest unidentified wallets hold at least {n}% of the supply"
  pt_contracts: "Trading pools, locks and contracts hold at least {n}%"
  pt_circulating: "Less than {n}% of the max supply (or total supply, if no max) circulates"
  pt_mint: RugCheck reports the mint authority as active
  pt_freeze: RugCheck reports the freeze authority as active
  pt_no_docs: No whitepaper or docs found through the project's own links
  sections:
    - id: about
      title: What Coin Sieve is
      paras:
        - Coin Sieve explains established crypto tokens in plain language, so you can understand what a token is, how its supply is split and who holds it in about two minutes.
        - It describes; it never suggests what to do. Nothing here is a ranking, a rating or a prediction.
    - id: coverage
      title: Which tokens are covered
      paras:
        - A token is covered when it meets every criterion in the table below, using the values currently in force. Tokens are checked again on every refresh.
        - A covered token that stops meeting a criterion stays on the list for a short grace period, so one unusual hour does not remove it. Being covered only means the token is old and large enough to profile.
        - Tokens from every blockchain are checked, from CoinGecko's list ordered by market cap. Age is a lower bound taken from CoinGecko's price records, so a token can be older than shown.
      table: coverage
    - id: sources
      title: Data sources
      paras:
        - Every number comes from one of these sources and is stored with the time it was fetched. The website only shows stored data; when data is older than expected, it is dimmed and marked.
      table: sources
    - id: prices
      title: Prices and market data
      paras:
        - Price, 1h, 24h and 7d change, market cap, volume and supply come from CoinGecko at the time of the last refresh, combined across the markets it tracks. The 7-day line uses CoinGecko's hourly prices from the same request.
        - Market cap counts only tokens in circulation. Tokens that are locked or not released yet are not included.
    - id: charts
      title: Token page chart
      paras:
        - The chart on each token page uses CoinGecko's price, market cap and volume history across all markets. It is hourly for the last 30 days (24h, 7d and 1M ranges) and daily for the last year (1Y).
        - The free CoinGecko service offers at most one year of history, so there is no all-time range. The line is green above and red below the first value of the chosen range.
    - id: points
      title: Points to check
      paras:
        - Each token page lists facts that cross one of the thresholds below, always with the number. They are not ratings and say nothing about where the price goes. Mint and freeze authority come from RugCheck; when RugCheck has no answer, nothing is shown.
      table: points
    - id: holders
      title: Holders and concentration
      paras:
        - Holder data is shown only for tokens issued on Solana. Concentration uses the 20 largest token accounts reported by RugCheck, grouped by owner wallet.
        - "Wallets are left out of “Top 10 holders” when they can be identified: trading pools (RugCheck), token locks (RugCheck), accounts controlled by a program rather than a person (read from the blockchain), and exchange wallets from a hand-kept list with a source for every address."
        - Wallets that cannot be identified stay in, including team, treasury and exchange wallets we do not know about. The share without any exclusions is shown next to it.
    - id: links
      title: Project links
      paras:
        - Website, whitepaper, docs, X and GitHub links are taken from the project's listing on CoinGecko and from links on the project's own homepage. The only address Coin Sieve tries on its own is docs.<project domain>, and it counts only if a page answers.
        - ✓ means a link was found. It does not mean the content was checked or is accurate.
    - id: supply
      title: Supply
      paras:
        - Circulating, total and maximum supply come from CoinGecko. Maximum supply is missing when the project has not published one. Market cap uses the circulating supply; FDV uses every token that will ever exist.
    - id: unlocks
      title: Token unlocks
      paras:
        - Unlock schedules are not yet available on this site. No unlock dates are estimated or guessed.
    - id: ai
      title: AI summaries
      paras:
        - Each token page has a short summary written by an AI model (DeepSeek). It reads the project's own whitepaper, docs site and homepage, found through the project's listings; when there are none, it uses widely reported public facts and says so. Every summary names its sources and date.
        - The summary only explains. It is checked automatically for advice, predictions and opinion words, and a summary that fails the check is not shown. Supply and allocation figures from documents are labelled as such and are not checked against on-chain data. Summaries are written again only when the documents change.
        - AI summaries can contain errors. Check the linked sources before relying on them.
    - id: limits
      title: Known limits
      paras:
        - Data can be late, incomplete or wrong at the source. A token can lose most of its value quickly even when every fact on this page looks unremarkable.
        - Holder data is available only for tokens issued on Solana. Names and logos come from the projects and are shown as listed.
    - id: disclaimer
      title: Disclaimer
      paras:
        - Coin Sieve is an information service. Nothing on this site is financial, investment, legal or tax advice, and nothing is an offer or a solicitation. Do your own research.

