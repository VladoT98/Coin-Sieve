# Coin Sieve configuration. All thresholds live here.
# Filter values below are STARTING GUESSES — tune them from logs/evaluations-*.jsonl.

chain: solana

# Tier membership. Sections below (discovery..posting) configure the New Launches pipeline.
tiers:
  new_launches:
    leave_after_hours: 2    # a member must fail continuously this long before a "left" event
  # Emerging/Established: Jupiter data. Scope = in age range AND mcap >= scope_min_mcap_usd
  # (only in-scope tokens are evaluated + logged). All values are starting guesses.
  emerging:
    leave_after_hours: 12
    min_age_days: 7
    max_age_days: 180
    scope_min_mcap_usd: 500000
    min_mcap_usd: 1000000
    max_mcap_usd: 50000000
    min_liquidity_usd: 250000
    min_volume_h24_usd: 100000
    min_holders: 5000
    min_organic_score: 50          # Jupiter organicScore 0-100 (share of non-bot activity)
    require_mint_authority_disabled: true
    require_freeze_authority_disabled: true
    max_top_holders_pct: 30        # Jupiter audit.topHoldersPercentage
  established:
    leave_after_hours: 24
    min_age_days: 365
    max_age_days: null
    scope_min_mcap_usd: 100000000
    min_mcap_usd: 200000000
    max_mcap_usd: null
    min_liquidity_usd: 2000000
    min_volume_h24_usd: 1000000
    min_holders: 20000
    min_organic_score: 50
    require_mint_authority_disabled: false   # shown as a fact, not required, for mature tokens
    require_freeze_authority_disabled: false
    max_top_holders_pct: null

jupiter:
  base_url: https://lite-api.jup.ag/tokens/v2
  universe:                      # token lists unioned each run (+ every token ever in a tier)
    - tag?query=verified
    - toporganicscore/24h?limit=100
    - toptraded/24h?limit=100
  # Not Solana-native products: stablecoins, staking/yield wrappers, tokenised stocks/RWA.
  exclude_tags: [stable, lst, yield, yb, rwa, stocks, xstocks, equities, prestocks, ondo, tessera, jup-lend-earn]
  exclude_mints:
    - So11111111111111111111111111111111111111112    # SOL (base asset)
    - cbbtcf3aa214zXHbiAZQwf4122FBYbraNdFqgw4iMij    # cbBTC (wrapped)
    - 3NZ9JMVBmGAqocybic2c7LQCJScmgsAZ6vQqTDzcqmJh   # WBTC (wrapped)
    - 5XZw2LKTyrfvfiskJ78AMpackRjPcyCif1WhUsPDuVqQ   # WBTC (wrapped)
    - 27G8MtK7VtTcCHkpASjSDdkWWYfoqT6ggEuKidVJidD4   # JLP (Jupiter liquidity-pool basket)
graduation:                 # "graduated" event when a token enters `to` after being in `from`
  from: new_launches
  to: emerging

discovery:
  # DexScreener feeds polled each run. Each returns only the latest ~30 entries,
  # so addresses are accumulated in the local store across runs.
  sources:
    - token-profiles/latest/v1
    - token-boosts/latest/v1
    - token-boosts/top/v1
    - community-takeovers/latest/v1

age:
  # Age = hours since the token's earliest pair (the bonding-curve pair for launchpad tokens).
  min_hours: 6
  max_hours: 48

filters:
  # Metrics come from DexScreener's main pair for the token (tokens/v1 endpoint).
  min_liquidity_usd: 20000   # liquidity.usd (both sides of the pool, in USD)
  min_volume_h24_usd: 50000  # volume.h24
  min_txns_h24: 300          # txns.h24.buys + txns.h24.sells
  min_socials: 1             # entries in info.socials (twitter/telegram/...)

launchpad:
  # dexIds seen in live data as pre-migration bonding curves (they have no `liquidity` field).
  # A token whose main pair is on one of these has not migrated to an AMM pool -> rejected.
  bonding_curve_dex_ids:
    - pumpfun
    - meteoradbc

rugcheck:
  # Only tokens that pass the hard filters are checked. A failed/incomplete report = reject.
  min_lp_locked_pct: 95        # locked/burned LP USD as % of liquidity across ALL markets
  max_top1_holder_pct: 10      # largest non-pool holder, % of supply
  max_top10_holders_pct: 30    # top 10 non-pool holders combined
  reject_risk_levels: [danger] # levels seen live: warn, danger

ranking:
  # Applied to tokens that passed hard filters + RugCheck in the CURRENT run.
  min_vol_liq_ratio: 0.5          # volume.h24 / liquidity.usd; live passers ranged 12-50
  max_vol_liq_ratio: 60
  holder_growth_window_hours: 6   # growth = holders gained per hour across snapshots in this window
  min_history_hours: 1.0          # need RugCheck snapshots spanning >= this before a token is postable
  min_holder_growth_per_hour: 0   # declining holder count -> not posted

posting:
  max_posts_per_day: 5            # UTC day, counted from the posts table
  post_zero_summary: false        # send one "0 passed" line when nothing is postable (max once/day)
  banned_words: [safe, gem, verified, buy]   # substring match on post prose; hit = token skipped
  disclaimer: "Not financial advice. Passing the filter is not a recommendation."

api:
  timeout_s: 20
  retries: 3
  dexscreener_base: https://api.dexscreener.com
  dexscreener_min_interval_s: 0.25   # pair endpoints allow 300 req/min; feeds 60 req/min
  rugcheck_base: https://api.rugcheck.xyz/v1
  rugcheck_min_interval_s: 1.0       # header X-Rate-Limit-Limit: 15; 1/s gave no 429s
  jupiter_min_interval_s: 1.0

storage:
  db_path: data/coinsieve.db
  log_dir: logs
