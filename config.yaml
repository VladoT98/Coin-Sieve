# Coin Sieve configuration. All thresholds live here.
# Filter values below are STARTING GUESSES — tune them from logs/evaluations-*.jsonl.

chain: solana

# Tier membership. Sections below (discovery..posting) configure the New Launches pipeline.
tiers:
  new_launches:
    leave_after_hours: 2    # a member must fail continuously this long before a "left" event
  # Emerging/Established: Jupiter data. Scope = in age range AND mcap >= scope_min_mcap_usd
  # (only in-scope tokens are evaluated + logged). All values are starting guesses.
  emerging:
    leave_after_hours: 12
    min_age_days: 7
    max_age_days: 180
    scope_min_mcap_usd: 500000
    min_mcap_usd: 1000000
    max_mcap_usd: 50000000
    min_liquidity_usd: 250000
    min_volume_h24_usd: 100000
    min_holders: 5000
    min_organic_score: 50          # Jupiter organicScore 0-100 (share of non-bot activity)
    require_mint_authority_disabled: true
    require_freeze_authority_disabled: true
    max_top_holders_pct: 30        # Jupiter audit.topHoldersPercentage
  established:
    leave_after_hours: 24
    min_age_days: 365
    max_age_days: null
    scope_min_mcap_usd: 100000000
    min_mcap_usd: 200000000
    max_mcap_usd: null
    min_liquidity_usd: 2000000
    min_volume_h24_usd: 1000000
    min_holders: 20000
    min_organic_score: 50
    require_mint_authority_disabled: false   # shown as a fact, not required, for mature tokens
    require_freeze_authority_disabled: false
    max_top_holders_pct: null

track_record:
  # Snapshot (Jupiter price/mcap/liquidity/holders) of every tier entry at these offsets.
  checkpoints_hours: {0h: 0, 24h: 24, 72h: 72, 7d: 168}
  catch_up_hours: 6               # a checkpoint missed by more than this (downtime) is skipped, not taken late
  baseline_max_delay_hours: 2     # entries whose 0h snapshot came later than this are left out of stats

presets:
  # One-click starting points in the dashboard Filters tab. Balanced = the defaults above.
  # These are informed guesses until the track record shows which settings hold up.
  new_launches:
    strict:   {filters.min_liquidity_usd: 40000, filters.min_volume_h24_usd: 150000, filters.min_txns_h24: 1000,
               filters.min_socials: 2, filters.max_dev_mints: 1, rugcheck.min_lp_locked_pct: 99,
               rugcheck.max_top1_holder_pct: 5, rugcheck.max_top10_holders_pct: 20}
    balanced: {filters.min_liquidity_usd: 20000, filters.min_volume_h24_usd: 50000, filters.min_txns_h24: 300,
               filters.min_socials: 1, filters.max_dev_mints: 3, rugcheck.min_lp_locked_pct: 95,
               rugcheck.max_top1_holder_pct: 10, rugcheck.max_top10_holders_pct: 30}
    loose:    {filters.min_liquidity_usd: 10000, filters.min_volume_h24_usd: 25000, filters.min_txns_h24: 150,
               filters.min_socials: 1, filters.max_dev_mints: 5, rugcheck.min_lp_locked_pct: 90,
               rugcheck.max_top1_holder_pct: 15, rugcheck.max_top10_holders_pct: 40}
  emerging:
    strict:   {tiers.emerging.min_mcap_usd: 2000000, tiers.emerging.min_liquidity_usd: 500000,
               tiers.emerging.min_volume_h24_usd: 250000, tiers.emerging.min_holders: 10000,
               tiers.emerging.min_organic_score: 70, tiers.emerging.max_top_holders_pct: 25}
    balanced: {tiers.emerging.min_mcap_usd: 1000000, tiers.emerging.min_liquidity_usd: 250000,
               tiers.emerging.min_volume_h24_usd: 100000, tiers.emerging.min_holders: 5000,
               tiers.emerging.min_organic_score: 50, tiers.emerging.max_top_holders_pct: 30}
    loose:    {tiers.emerging.min_mcap_usd: 500000, tiers.emerging.min_liquidity_usd: 150000,
               tiers.emerging.min_volume_h24_usd: 50000, tiers.emerging.min_holders: 2500,
               tiers.emerging.min_organic_score: 40, tiers.emerging.max_top_holders_pct: 40}
  established:
    strict:   {tiers.established.min_mcap_usd: 500000000, tiers.established.min_liquidity_usd: 5000000,
               tiers.established.min_volume_h24_usd: 5000000, tiers.established.min_holders: 50000,
               tiers.established.min_organic_score: 70}
    balanced: {tiers.established.min_mcap_usd: 200000000, tiers.established.min_liquidity_usd: 2000000,
               tiers.established.min_volume_h24_usd: 1000000, tiers.established.min_holders: 20000,
               tiers.established.min_organic_score: 50}
    loose:    {tiers.established.min_mcap_usd: 100000000, tiers.established.min_liquidity_usd: 1000000,
               tiers.established.min_volume_h24_usd: 500000, tiers.established.min_holders: 10000,
               tiers.established.min_organic_score: 40}

jupiter:
  base_url: https://lite-api.jup.ag/tokens/v2
  universe:                      # token lists unioned each run (+ every token ever in a tier)
    - tag?query=verified
    - toporganicscore/24h?limit=100
    - toptraded/24h?limit=100
  # Not Solana-native products: stablecoins, staking/yield wrappers, tokenised stocks/RWA.
  exclude_tags: [stable, lst, yield, yb, rwa, stocks, xstocks, equities, prestocks, ondo, tessera, jup-lend-earn]
  exclude_mints:
    - So11111111111111111111111111111111111111112    # SOL (base asset)
    - cbbtcf3aa214zXHbiAZQwf4122FBYbraNdFqgw4iMij    # cbBTC (wrapped)
    - 3NZ9JMVBmGAqocybic2c7LQCJScmgsAZ6vQqTDzcqmJh   # WBTC (wrapped)
    - 5XZw2LKTyrfvfiskJ78AMpackRjPcyCif1WhUsPDuVqQ   # WBTC (wrapped)
    - 27G8MtK7VtTcCHkpASjSDdkWWYfoqT6ggEuKidVJidD4   # JLP (Jupiter liquidity-pool basket)
graduation:                 # "graduated" event when a token enters `to` after being in `from`
  from: new_launches
  to: emerging

discovery:
  # DexScreener feeds polled each run. Each returns only the latest ~30 entries,
  # so addresses are accumulated in the local store across runs.
  sources:
    - token-profiles/latest/v1
    - token-boosts/latest/v1
    - token-boosts/top/v1
    - community-takeovers/latest/v1

age:
  # Age = hours since the token's earliest pair (the bonding-curve pair for launchpad tokens).
  min_hours: 6
  max_hours: 48

filters:
  # Metrics come from DexScreener's main pair for the token (tokens/v1 endpoint).
  min_liquidity_usd: 20000   # liquidity.usd (both sides of the pool, in USD)
  min_volume_h24_usd: 50000  # volume.h24
  min_txns_h24: 300          # txns.h24.buys + txns.h24.sells
  min_socials: 1             # entries in info.socials (twitter/telegram/...)
  max_dev_mints: 3           # Jupiter audit.devMints: tokens launched by the same creator (one had 346)

launchpad:
  # dexIds seen in live data as pre-migration bonding curves (they have no `liquidity` field).
  # A token whose main pair is on one of these has not migrated to an AMM pool -> rejected.
  bonding_curve_dex_ids:
    - pumpfun
    - meteoradbc

rugcheck:
  # Only tokens that pass the hard filters are checked. A failed/incomplete report = reject.
  min_lp_locked_pct: 95        # locked/burned LP USD as % of liquidity across ALL markets
  max_top1_holder_pct: 10      # largest non-pool holder, % of supply
  max_top10_holders_pct: 30    # top 10 non-pool holders combined
  reject_risk_levels: [danger] # levels seen live: warn, danger

ranking:
  # Applied to tokens that passed hard filters + RugCheck in the CURRENT run.
  min_vol_liq_ratio: 0.5          # volume.h24 / liquidity.usd; live passers ranged 12-50
  max_vol_liq_ratio: 60
  holder_growth_window_hours: 6   # growth = holders gained per hour across snapshots in this window
  min_history_hours: 1.0          # need Jupiter holder snapshots spanning >= this before a token is postable
  min_holder_growth_per_hour: 0   # declining holder count -> not posted

publishing:                       # Telegram digests (and later the website)
  per_tier: 3                     # tokens per tier on the daily card (3-5 looks good)
  feature_cooldown_days: 7        # Emerging/Established: don't re-feature a token within this many days
                                  # (New Launches are never shown twice per chat)
  chart_hours: 48                 # price sparkline length on the card
  logo_tiers: [emerging, established]   # real logos only here; New Launches get letter badges (unvetted images)
  concentration_warning_pct: 50   # show a warning badge when top wallets hold at least this % of supply
  daily_max_metrics_age_minutes: 90   # skip tokens whose latest evaluation is older (stale data)
  post_zero_summary: false        # daily digest says "0 passed" instead of sending nothing
  alerts_lookback_hours: 24       # Established alerts consider events this recent
  bootstrap_hours: 1              # events within this long after a tier's first run = initial fill, never posted
  site_url: ""                    # added to every post once the website exists (Stage 8)
  max_symbol_len: 12
  max_name_len: 32
  banned_words: [safe, gem, verified, buy]   # never in our wording; a token NAME containing one is skipped
  # Names containing these are never published (substring, case-insensitive). Edit freely —
  # avoid short words that sit inside innocent ones (e.g. "rape" in "grape", "cum" in "document").
  blocked_words: [fuck, shit, pussy, cunt, nigg, fagg, porn, penis, vagina, boob, buttock, hitler, nazi]
  disclaimer: "Not financial advice. Passing the filter is not a recommendation."

api:
  timeout_s: 20
  retries: 3
  dexscreener_base: https://api.dexscreener.com
  dexscreener_min_interval_s: 0.25   # pair endpoints allow 300 req/min; feeds 60 req/min
  rugcheck_base: https://api.rugcheck.xyz/v1
  rugcheck_min_interval_s: 1.0       # header X-Rate-Limit-Limit: 15; 1/s gave no 429s
  jupiter_min_interval_s: 1.0
  # Dashboard live prices: Jupiter Price v3 (no key, ≤ 50 ids per call; fields usdPrice, priceChange24h).
  jupiter_price_url: https://lite-api.jup.ag/price/v3
  price_refresh_s: 15                # browser polls visible rows this often; server caches this long
  geckoterminal_base: https://api.geckoterminal.com/api/v2
  geckoterminal_min_interval_s: 7.0  # 429s seen after ~6 calls at 2.1 s spacing
  geckoterminal_backoff_s: 20        # after a 429: wait 20 s, then 40 s

market:                       # dashboard top strip; fetched by the dashboard server, cached in SQLite
  refresh_minutes: 10
  stale_after_minutes: 60     # older numbers are dimmed and marked "stale"
  change_window_hours: [20, 28]   # Total open-interest 24h change needs a stored snapshot this old
  keep_days: 8
  coingecko_spacing_s: 6      # keyless CoinGecko answered 429 after ~3 quick calls (2026-10-09)
  urls:
    fng: https://api.alternative.me/fng/?limit=2
    coingecko: https://api.coingecko.com/api/v3
    binance_futures: https://fapi.binance.com
    bybit: https://api.bybit.com

charts:                       # dashboard price sparklines (GeckoTerminal hourly OHLCV, cached in SQLite)
  history_hours:              # window shown per tier ("48h Price" / "7d Price")
    new_launches: 48
    emerging: 168
    established: 168
  refresh_minutes:            # a token's series is re-fetched at most this often
    new_launches: 30
    emerging: 120
    established: 240
  tier_order: [new_launches, emerging, established]   # fetch priority between tiers
  max_calls_per_run: 40       # OHLCV calls at the end of each `run` (~7 s apart -> ~5 min)
  include_failing: false      # failing tokens are fetched only after they were viewed on the dashboard
  demand_window_minutes: 30   # rows shown on the dashboard this recently are fetched first
  pool_refresh_hours: 12      # re-resolve the highest-liquidity pool (DexScreener) after this long
  stale_after_hours: 6        # older series are drawn dimmed and marked "stale"
  min_points: 2               # fewer stored closes than this -> "–", never a line

storage:
  db_path: data/coinsieve.db
  card_dir: data/cards       # daily card PNGs (git-ignored with data/)
  logo_dir: data/logos       # cached, normalised token logos
  log_dir: logs
